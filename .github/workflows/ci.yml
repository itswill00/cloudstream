name: CI

# The workflows of the upstream repository need a GitHub App that only exists
# in the upstream organisation, they cannot run here. This workflow does the
# same checks without any secret: build the app, run the linter and the unit
# tests and make the APK available as an artifact.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already has the Android SDK, the setup-android action
      # is not used because it tries to install the removed "tools" package.

      - name: Get compile SDK
        id: sdk
        run: |
          COMPILE_SDK=$(grep -E '^\s*compileSdk\s*=' gradle/libs.versions.toml | grep -o '[0-9]\+' | head -1)
          echo "version=$COMPILE_SDK" >> $GITHUB_OUTPUT

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-${{ steps.sdk.outputs.version }}.0"

      - name: Grant execute permission
        run: chmod +x gradlew build.sh

      - name: Build
        run: ./build.sh debug

      - name: Lint
        run: ./gradlew lintPrereleaseDebug

      - name: Unit tests
        run: ./gradlew testPrereleaseDebugUnitTest

      - name: Ensure binary compatibility
        # To make sure the code stays backwards compatible, a change of the
        # public API needs a @Prerelease annotation.
        run: ./gradlew library:checkKotlinAbi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-apk
          path: "app/build/outputs/apk/prerelease/debug/*.apk"
          if-no-files-found: error
